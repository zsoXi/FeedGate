<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FeedGate</title><link rel="stylesheet" href="ui.css"></head><body class="popup">
<div class="topline"><div class="wordmark"><img class="brand-icon" src="icons/48.png" alt="">FeedGate 3.1.1</div><span id="connection" class="badge warn">Locked</span></div><div class="eyebrow">This tab</div><h1 id="host">Loading...</h1><p id="page-info">Reading extension status.</p><button id="site-toggle" class="primary site-button" disabled>Enable on this platform</button>
<div class="metrics"><div class="metric first"><div class="eyebrow">Hidden now</div><strong id="filtered">0</strong><small>Current page only</small></div><div class="metric"><div class="eyebrow">Observed</div><strong id="observed">0</strong><small id="pending">No pending requests</small></div></div>
<div class="row-labelled"><label for="hud-mode">Status panel</label><select id="hud-mode"><option value="compact">Compact pill</option><option value="expanded">Open panel</option><option value="hidden">Hidden</option></select></div>
<div class="buttons"><button id="restore" disabled>Show filtered posts</button><button id="rescan" disabled>Rescan this page</button><button id="pick" disabled>Pick element</button><button id="pause">Pause everywhere</button></div>
<div class="section-label">Feeds</div><p id="feeds-line" class="fine">Reading feed status.</p><div class="buttons"><button id="enable-all">Enable all supported feeds</button><button id="disable-all">Disable all feeds</button></div>
<div class="section-label">Cosmetic filters</div><p id="cosmetic-line" class="fine">No cosmetic filter data yet.</p><div class="buttons"><button id="cosmetic-toggle">Disable cosmetic filtering</button><button id="undo-rule" disabled>Undo last picked rule</button></div><button id="manage-rules" style="width:100%;margin-top:6px">My cosmetic filters ↗</button>
<div class="section-label">Recovery</div><p id="recovery-line" class="fine">Nothing to recover.</p><div class="buttons"><button id="recover-site" disabled>Restore this site</button><button id="resume-site" disabled>Resume this site</button></div><button id="reload-paused" style="width:100%;margin-top:6px" disabled>Reload this tab with filtering paused</button>
<div id="error-box" class="statusline error hidden" role="alert"></div><button id="diagnostics" style="width:100%;margin-top:10px">Diagnostics &amp; export</button><div id="message" class="statusline" role="status"></div><div class="footer"><span class="fine">No bridge. Direct Jev API.</span><button id="settings" class="small-btn">Settings ↗</button></div><script type="module" src="popup.js"></script></body></html>
